project:
  type: default
  output-dir: _site
  render:
    - index.qmd

title: "Post-Processing GNSS Acquisitions in Brazil: A Practical Guide"
subtitle: "From Field Observations to Centimeter-Grade Coordinates: IBGE RBMC, Emlid Studio PPK, RTKlib, and IBGE PPP"
author:
  - name: "Thiago S. F. Silva"
    affiliation: "University of Stirling / University of Manchester"
date: today
date-format: "YYYY-MM-DD"

format:
  html:
    theme:
      light: cosmo
    toc: true
    toc-depth: 3
    toc-title: "Table of Contents"
    number-sections: true
    code-copy: true
    code-overflow: wrap
    mermaid:
      theme: neutral
    smooth-scroll: true